<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE LILYWHITES · LEGACY</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a15}
#gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050a15}
</style>
</head>
<body>
<iframe id="gameFrame" src="./game.html" title="THE LILYWHITES · LEGACY"></iframe>
<script>
(()=>{
  const frame=document.getElementById("gameFrame");
  frame.addEventListener("load",()=>{
    const w=frame.contentWindow;
    const d=frame.contentDocument;
    if(!w||!d||d.getElementById("lily-maintenance-script")) return;

    const style=d.createElement("style");
    style.id="lily-maintenance-style";
    style.textContent=`
      .maintenance-overlay{position:fixed;inset:0;z-index:12000;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,rgba(255,210,72,.08),rgba(0,0,0,0) 34%),rgba(2,7,16,.88);backdrop-filter:blur(7px)}
      .maintenance-overlay.show{display:flex}
      .maintenance-panel{width:min(620px,94vw);border-radius:24px;border:1px solid rgba(255,215,74,.42);background:linear-gradient(180deg,rgba(18,27,48,.98),rgba(8,14,29,.99));box-shadow:0 30px 90px rgba(0,0,0,.62),0 0 0 1px rgba(255,219,94,.08) inset,0 0 42px rgba(255,197,38,.08);padding:30px 28px 28px;text-align:center}
      .maintenance-title{margin:0 0 20px;color:#ffd84d;font-size:clamp(38px,7vw,68px);line-height:1;font-weight:1000;letter-spacing:-2px;text-shadow:0 0 18px rgba(255,211,70,.25)}
      .maintenance-message{color:#ffe67a;font-size:clamp(15px,2.3vw,19px);font-weight:850;line-height:1.85;word-break:keep-all}
      .maintenance-message p{margin:5px 0}
      .maintenance-note{margin-top:20px;padding-top:17px;border-top:1px solid rgba(255,220,95,.16);color:#b5c2dc;font-size:12px;line-height:1.6}
    `;
    d.head.appendChild(style);

    const overlay=d.createElement("div");
    overlay.id="maintenanceOverlay";
    overlay.className="maintenance-overlay";
    overlay.setAttribute("aria-hidden","true");
    overlay.innerHTML=`
      <div class="maintenance-panel" role="dialog" aria-modal="true" aria-labelledby="maintenanceTitle">
        <h2 id="maintenanceTitle" class="maintenance-title">점검중</h2>
        <div class="maintenance-message">
          <p>현재 업데이트를 위해 점검중에 있습니다.</p>
          <p>21시 이전에는 끝낼 수 있도록 노력하겠습니다.</p>
          <p>업데이트가 완료되면 카페에 패치노트글과 함께 서버 오픈하겠습니다.</p>
        </div>
        <div class="maintenance-note">점검 중에는 새 시즌을 시작할 수 없습니다.</div>
      </div>`;
    d.body.appendChild(overlay);

    const counter=d.getElementById("lilySeasonPlayCount");
    if(counter && counter.parentElement){
      const p=counter.parentElement;
      for(const node of [...p.childNodes]){
        if(node.nodeType===3 && node.nodeValue.includes("시즌 플레이")){
          node.nodeValue=node.nodeValue.replace("시즌 플레이","새 시즌 플레이");
        }
      }
    }

    const script=d.createElement("script");
    script.id="lily-maintenance-script";
    script.textContent=`
      (()=>{
        const MAINTENANCE_URL = LILY_SUPABASE_URL + "/rest/v1/game_config?id=eq.1&select=maintenance";
        let maintenanceActive=false;
        let maintenanceCheckPromise=null;
        let seasonStarted=false;
        let bypassNextDrawGuard=false;

        function showMaintenancePopup(){
          const el=document.getElementById("maintenanceOverlay");
          if(!el)return;
          el.classList.add("show");
          el.setAttribute("aria-hidden","false");
        }
        function hideMaintenancePopup(){
          const el=document.getElementById("maintenanceOverlay");
          if(!el)return;
          el.classList.remove("show");
          el.setAttribute("aria-hidden","true");
        }
        async function refreshMaintenanceState(){
          if(maintenanceCheckPromise)return maintenanceCheckPromise;
          maintenanceCheckPromise=(async()=>{
            try{
              const rows=await billboardRequest("game_config?id=eq.1&select=maintenance",{
                method:"GET",
                cache:"no-store",
                headers:{"Accept":"application/json"}
              });
              maintenanceActive=!!(rows&&rows[0]&&rows[0].maintenance);
              if(maintenanceActive&&!seasonStarted)showMaintenancePopup(); else hideMaintenancePopup();
              return maintenanceActive;
            }catch(error){
              console.warn("Maintenance state read unavailable",error);
              return maintenanceActive;
            }finally{maintenanceCheckPromise=null;}
          })();
          return maintenanceCheckPromise;
        }
        async function guardNewSeasonStart(){
          const active=await refreshMaintenanceState();
          if(active){showMaintenancePopup();return false;}
          return true;
        }
        window.lilyMaintenance={get active(){return maintenanceActive},refresh:refreshMaintenanceState,guardNewSeasonStart,show:showMaintenancePopup};

        refreshMaintenanceState();

        document.addEventListener("click",async(event)=>{
          const btn=event.target.closest&&event.target.closest("#drawBtn");
          if(!btn)return;
          if(bypassNextDrawGuard){bypassNextDrawGuard=false;seasonStarted=true;return;}
          if(seasonStarted)return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const ok=await guardNewSeasonStart();
          if(ok){bypassNextDrawGuard=true;btn.click();}
        },true);

        ["resetBtn","simulationResetBtn","gameOverRestart","seasonRestartSmall"].forEach(id=>{
          const el=document.getElementById(id);
          if(el)el.addEventListener("click",()=>{seasonStarted=false;if(maintenanceActive)showMaintenancePopup();});
        });
      })();
    `;
    d.body.appendChild(script);
  });
})();
</script>
</body>
</html>
